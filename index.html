<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Viewer</title>
    
    <script src="image_processor.js"></script>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <div class="folder-buttons">
        <button class="folder-button-change" id="change-folder">
            <i class="material-symbols-outlined">folder</i>
            <p class="curr-folder-label" id="curr-folder-label">No folder selected</p>
        </button>
        <button class="icon-button" id="update-images">
            <i class="material-symbols-outlined">refresh</i>
        </button>
        <div class="setting-buttons">
            <button class="icon-button" id="light-dark-mode">
                <i class="material-symbols-outlined" id="dark-mode-icon">dark_mode</i>
                <i class="material-symbols-outlined" id="light-mode-icon">light_mode</i>
            </button>
        </div>
    </div>

    <div class="select-folder-box hidden" id="select-folder-box">
<!--         <div class="select-folder-options">
            <button id="select-folder-pick">Pick Folder</button>   
            <button id="select-folder-link">Use Link</button>
        </div> -->
        <button class="select-folder-close icon-button" id="select-folder-close">
            <i class="material-symbols-outlined">close</i>
        </button>
        <div class="select-folder-link-box" id="select-folder-link-box">
            <input type="text" id="select-folder-link-input" placeholder="drive.google.com/drive/folders/..." />
            <button id="select-folder-link-submit">
                <i class="material-symbols-outlined">check</i>
            </button>
            <div class="select-folder-link-loader hidden" id="select-folder-link-loader"></div>
        </div>
    </div>

    <div class="main-box">
        <button class="icon-button" id="prev-date">
            <i class="material-symbols-outlined">arrow_back</i>
        </button>
        <div class="calendars">
            <h1 class="calendar-label" id="cal-label">?</h1>
            <div class="month-view hidden" id="month-view">
                <ol class="month-week-box" id="month-week-box">

                </ol>
                <ol class="month-days-box" id="month-days-box">

                </ol>
            </div>
            <div class="year-view hidden" id="year-view">
                <ol class="year-months-box" id="year-months-box">

                </ol>
            </div>
            <div class="day-view hidden" id="day-view">
                <div class="day-controls-box">
                    <button class="icon-button" id="day-back-button">
                        <i class="material-symbols-outlined">event_repeat</i>
                    </button>
                </div>
                <ol id="day-images">

                </ol>
            </div>
            <div class="single-view hidden" id="single-view">
                <img id="single-img">
                <div class="single-info">

                </div>
            </div>
        </div>
        <button class="icon-button" id="next-date">
            <i class="material-symbols-outlined">arrow_forward</i>
        </button>
    </div>
</body>
</html>
